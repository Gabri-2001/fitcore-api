services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitcoredb
      POSTGRES_USER: fitcore
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
    ports:
      - "5432:5432"
    volumes:
      - fitcore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcore -d fitcoredb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/fitcoredb
      DB_USERNAME: fitcore
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MEDIA_STORAGE_DIR: /app/data/exercise-media
    ports:
      - "8080:8080"
    volumes:
      - fitcore-media:/app/data/exercise-media
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  fitcore-postgres:
  fitcore-media:
