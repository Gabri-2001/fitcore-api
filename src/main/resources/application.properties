spring.application.name=fitcore-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitcoredb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

app.security.jwt.secret=${JWT_SECRET:ZmFrZVN1cGVyU2VjdXJlQmFzZTY0S2V5Rm9yRml0Q29yZUFwaVByb2plY3QxMjM0NTY3ODkw}
app.security.jwt.expiration-millis=86400000
