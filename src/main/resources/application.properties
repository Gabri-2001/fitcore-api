spring.application.name=fitcore-api
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitcoredb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

app.security.jwt.expiration-millis=86400000
app.security.refresh-token.expiration-millis=2592000000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.media.exercise-storage-dir=${MEDIA_STORAGE_DIR:./data/exercise-media}
app.media.exercise-base-url=${MEDIA_BASE_URL:/media/exercises}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
