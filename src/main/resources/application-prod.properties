spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
app.security.refresh-token.expiration-millis=${REFRESH_TOKEN_EXPIRATION_MILLIS:2592000000}

management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
