name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check FitCore Lab JavaScript syntax
        run: node --check src/main/resources/static/fitcore-lab/app.js
      - name: Test
        run: ./mvnw -B verify
