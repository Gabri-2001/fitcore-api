name: CI

on:
  push:
    branches: [main, master, "fix/**", "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check frontend JavaScript syntax
        run: node --check src/main/resources/static/fitcore-lab/app.js
      - name: Frontend regression tests
        run: node --test src/test/js/*.test.cjs
      - name: Test backend and database migrations
        run: sh ./mvnw -B verify
